<script>
'use strict';
const DATA = JSON.parse(document.getElementById('map-data').textContent);
const rawNodes = new Map(DATA.nodes.map(n => [n.id,n]));
const names = {module:'模块',file:'文件',contract:'契约',external:'外部边界'};
const kinds = {import:'引用',call:'调用',contract:'接口契约',event:'事件',read:'读取',write:'写入',config:'配置', 'depends-on':'依赖'};
const $ = id => document.getElementById(id);
let mode='modules', selected=null, selectedEdge=null, projection=null, viewport=null, fitted=null;
let drag=null, moved=false, toastTimer;
function el(tag, className, text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function svgEl(tag,attrs={}){const node=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))node.setAttribute(k,v);return node;}
function short(text,max=23){return text.length>max?text.slice(0,max-1)+'…':text;}
function owner(id){const n=rawNodes.get(id);return n.module||id;}
function projected(){
  if(mode==='files')return {nodes:DATA.nodes.filter(n=>n.kind!=='module'||DATA.edges.some(e=>e.source===n.id||e.target===n.id)),edges:DATA.edges.map((e,i)=>({...e,id:'edge:'+i,count:1}))};
  const grouped=new Map();
  for(const edge of DATA.edges){const source=owner(edge.source),target=owner(edge.target);if(source===target)continue;const id=JSON.stringify([source,target,edge.kind,edge.status]);
    if(!grouped.has(id))grouped.set(id,{...edge,id,source,target,evidence:[],count:0});
    const group=grouped.get(id);group.count++;group.evidence.push(...edge.evidence);
  }
  return {nodes:DATA.nodes.filter(n=>n.kind==='module'||!n.module),edges:[...grouped.values()]};
}
function neighbors(id,edges){const result=new Set([id]);for(const e of edges){if(e.source===id)result.add(e.target);if(e.target===id)result.add(e.source);}return result;}
function setMode(next){if(next===mode)return;mode=next;selectedEdge=null;
  if(selected&&mode==='modules')selected=owner(selected);
  if(selected&&mode==='files'&&rawNodes.get(selected).kind==='module')selected=null;
  $('focus').checked=false;render();
}
function chooseNode(id){selected=id;selectedEdge=null;if(projection.nodes.length>120)$('focus').checked=true;render();}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制源码位置')).catch(()=>toast('请从证据中选中并复制源码位置'));
  else toast('请从证据中选中并复制源码位置');
}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500);}
function evidence(container,items,status){
  for(const item of items){const box=el('div','evidence '+status);const location=item.path+':'+item.line+(item.end_line&&item.end_line!==item.line?'–'+item.end_line:'');const button=el('button',null,location);button.title='复制源码位置';button.onclick=()=>copy(item.path+':'+item.line);box.append(button,el('p',null,item.note));container.append(box);}
}
function coverage(container){
  container.append(el('h4',null,'覆盖范围'));
  const scanned=DATA.snapshot.file_count,read=DATA.coverage.reviewed_files.length;
  container.append(el('p',null,`清单 ${scanned} 个文件，已阅读 ${read} 个。已阅读不表示该文件的所有关系均已识别。`));
  if(DATA.coverage.unresolved.length){const ul=el('ul','coverage-list');for(const item of DATA.coverage.unresolved)ul.append(el('li',null,item));container.append(el('h4',null,'尚未确认'),ul);}
  container.append(el('h4',null,'扫描边界'),el('p',null,'排除目录：'+DATA.snapshot.excluded_directories.join('、')));
  if(DATA.snapshot.exclude_paths.length)container.append(el('p',null,'额外排除：'+DATA.snapshot.exclude_paths.join('、')));
  container.append(el('p',null,`另有 ${DATA.snapshot.excluded_files.length} 个文件因凭证、大小、链接或读取限制被排除。Git 忽略文件不在清单中；非 Git 模式不完整解析 .gitignore。`));
  container.append(el('div','notice','本页展示生成时的源码快照。修改源码后应复核并刷新关系；当前页面不能实时核验本地项目。'));
}
function details(){
  const box=$('details');box.replaceChildren();box.append(el('div','detail-heading',selectedEdge?'RELATION / EVIDENCE':selected?'NODE / CONTEXT':'PROJECT / OVERVIEW'));
  const edge=projection.edges.find(e=>e.id===selectedEdge);
  if(edge){box.append(el('h3',null,rawNodes.get(edge.source).label+' → '+rawNodes.get(edge.target).label),el('span','tag',kinds[edge.kind]),el('span','tag '+edge.status,edge.status==='confirmed'?'已确认':'待核实'),el('p',null,(edge.label||'依赖关系')+(edge.count>1?` · 聚合 ${edge.count} 条关系`:'')),el('h4',null,'源码证据'));evidence(box,edge.evidence,edge.status);return;}
  const node=rawNodes.get(selected);
  if(!node){box.append(el('h3',null,'沿着连接理解项目'),el('p',null,DATA.overview));coverage(box);return;}
  box.append(el('h3',null,node.label),el('span','tag',names[node.kind]));
  if(node.path)box.append(el('p',null,node.path));
  if(node.summary)box.append(el('p',null,node.summary));
  if(node.module)box.append(el('p',null,'所属模块：'+rawNodes.get(node.module).label));
  for(const [title,key,other]of [['依赖的对象','source','target'],['依赖它的对象','target','source']]){
    box.append(el('h4',null,title));const related=projection.edges.filter(e=>e[key]===node.id&&statusAllowed(e));
    if(!related.length)box.append(el('p',null,'当前筛选下没有记录。'));
    for(const e of related){const row=el('div','detail-row');const button=el('button',null,rawNodes.get(e[other]).label);button.onclick=()=>{selectedEdge=e.id;render(false);};row.append(button,el('small',null,kinds[e.kind]+' · '+(e.status==='confirmed'?'已确认':'待核实')+(e.count>1?' · '+e.count+' 条':'')));box.append(row);}
  }
  if(node.kind==='module'){const members=DATA.nodes.filter(n=>n.module===node.id);box.append(el('h4',null,'模块成员 · '+members.length));for(const member of members){const row=el('div','detail-row');const button=el('button',null,member.label);button.onclick=()=>{mode='files';selected=member.id;selectedEdge=null;$('focus').checked=true;render();};row.append(button,el('small',null,member.path||names[member.kind]));box.append(row);}}
  const attached=projection.edges.filter(e=>(e.source===node.id||e.target===node.id)&&statusAllowed(e));
  if(attached.length){box.append(el('h4',null,'关联证据'));for(const e of attached)evidence(box,e.evidence,e.status);}
}
function statusAllowed(e){return $(e.status).checked&&($('relation-kind').value==='all'||$('relation-kind').value===e.kind);}
function draw(nodes,edges,resetView){
  const svg=$('graph');svg.replaceChildren();$('empty-state').classList.toggle('hidden',nodes.length!==0);if(!nodes.length)return;
  const defs=svgEl('defs');for(const [id,color]of [['arrow','#829ba3'],['pending','#a47837']]){const marker=svgEl('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(marker);}svg.append(defs);
  const ranks=new Map(),degrees=new Map(nodes.map(n=>[n.id,0]));for(const e of edges)degrees.set(e.target,(degrees.get(e.target)||0)+1);
  const queue=nodes.filter(n=>degrees.get(n.id)===0).sort((a,b)=>a.label.localeCompare(b.label)).map(n=>n.id);for(const id of queue)ranks.set(id,0);
  for(let i=0;i<queue.length;i++){const id=queue[i];for(const e of edges.filter(e=>e.source===id)){ranks.set(e.target,Math.min(8,Math.max(ranks.get(e.target)||0,ranks.get(id)+1)));degrees.set(e.target,degrees.get(e.target)-1);if(degrees.get(e.target)===0)queue.push(e.target);}}
  for(const n of nodes)if(!ranks.has(n.id))ranks.set(n.id,0);
  const columns=new Map();for(const n of nodes){const rank=ranks.get(n.id);if(!columns.has(rank))columns.set(rank,[]);columns.get(rank).push(n);}
  const maxRank=Math.max(...columns.keys()),maxItems=Math.max(...[...columns.values()].map(c=>c.length));
  const vertical=svg.clientWidth/svg.clientHeight<1.95,NODE_W=190,NODE_H=68,COL_GAP=92,ROW_GAP=28,PAD_X=54,PAD_Y=54,LANE=28;
  const width=vertical?Math.max(430,PAD_X*2+maxItems*NODE_W+(maxItems-1)*ROW_GAP):PAD_X*2+(maxRank+1)*NODE_W+maxRank*COL_GAP;
  const height=vertical?PAD_Y*2+(maxRank+1)*NODE_H+maxRank*COL_GAP:PAD_Y*2+LANE+maxItems*NODE_H+(maxItems-1)*ROW_GAP;
  const positions=new Map();for(const [rank,column]of columns){column.sort((a,b)=>a.label.localeCompare(b.label));column.forEach((n,i)=>positions.set(n.id,vertical?{x:PAD_X+i*(NODE_W+ROW_GAP),y:PAD_Y+LANE+rank*(NODE_H+COL_GAP)}:{x:PAD_X+rank*(NODE_W+COL_GAP),y:PAD_Y+LANE+i*(NODE_H+ROW_GAP)}));}
  const guides=svgEl('g',{class:'graph-guides','aria-hidden':'true'});for(let rank=0;rank<=maxRank;rank++){if(vertical){const y=PAD_Y+rank*(NODE_H+COL_GAP);const text=svgEl('text',{x:PAD_X,y:y+14,class:'lane-label'});text.textContent='依赖深度 '+rank;guides.append(text);if(rank<maxRank)guides.append(svgEl('line',{x1:PAD_X-12,y1:y+NODE_H+COL_GAP/2,x2:width-PAD_X+12,y2:y+NODE_H+COL_GAP/2,class:'lane-rule'}));}else{const x=PAD_X+rank*(NODE_W+COL_GAP);const text=svgEl('text',{x,y:PAD_Y+14,class:'lane-label'});text.textContent='依赖深度 '+rank;guides.append(text);if(rank<maxRank)guides.append(svgEl('line',{x1:x+NODE_W+COL_GAP/2,y1:PAD_Y+LANE-2,x2:x+NODE_W+COL_GAP/2,y2:height-PAD_Y+10,class:'lane-rule'}));}}svg.append(guides);
  const adjacent=selected?neighbors(selected,edges):null;
  for(const e of edges){const a=positions.get(e.source),b=positions.get(e.target);let d;
    if(vertical){const from={x:a.x+NODE_W/2,y:a.y+NODE_H},to={x:b.x+NODE_W/2,y:b.y},midY=(from.y+to.y)/2;d=from.y<to.y?`M${from.x},${from.y} V${midY} H${to.x} V${to.y}`:`M${from.x},${from.y} V${from.y+28} H${to.x+NODE_W/2+28} V${to.y-28} H${to.x} V${to.y}`;
    }else{const from={x:a.x+NODE_W,y:a.y+NODE_H/2},to={x:b.x,y:b.y+NODE_H/2},midX=(from.x+to.x)/2;d=from.x<to.x?`M${from.x},${from.y} H${midX} V${to.y} H${to.x}`:`M${from.x},${from.y} H${from.x+34} V${to.y+34} H${to.x-34} V${to.y}`;}
    const group=svgEl('g',{class:'edge '+e.status+(selected&&e.source!==selected&&e.target!==selected?' muted':'')+(selectedEdge===e.id?' active':''),tabindex:0,role:'button','aria-label':rawNodes.get(e.source).label+' 依赖 '+rawNodes.get(e.target).label,'data-edge':e.id});
    group.append(svgEl('path',{d,class:'hit'}),svgEl('path',{d,'marker-end':'url(#'+(e.status==='inferred'?'pending':'arrow')+')'}));
    const title=svgEl('title');title.textContent=(e.label||kinds[e.kind])+' · '+(e.status==='confirmed'?'已确认':'待核实');group.append(title);
    const choose=()=>{selectedEdge=e.id;render(false);};group.addEventListener('click',()=>{if(!moved)choose();});group.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();choose();}});svg.append(group);
  }
  for(const n of nodes){const p=positions.get(n.id),group=svgEl('g',{class:'graph-node '+n.kind+(selected===n.id?' active':'')+(adjacent&&!adjacent.has(n.id)?' muted':''),transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':n.label,'data-node':n.id});group.append(svgEl('rect',{width:NODE_W,height:NODE_H,rx:2,class:'node-box'}));
    if(vertical){group.append(svgEl('circle',{cx:NODE_W/2,cy:0,r:3,class:'node-port'}),svgEl('circle',{cx:NODE_W/2,cy:NODE_H,r:3,class:'node-port'}));}else{group.append(svgEl('circle',{cx:0,cy:NODE_H/2,r:3,class:'node-port'}),svgEl('circle',{cx:NODE_W,cy:NODE_H/2,r:3,class:'node-port'}));}
    const kind=svgEl('text',{x:14,y:16,class:'node-kind'});kind.textContent=names[n.kind];const label=svgEl('text',{x:14,y:39,class:'node-label'});label.textContent=short(n.label,20);const sub=svgEl('text',{x:14,y:58,class:'node-sub'});sub.textContent=short(n.kind==='module'?DATA.nodes.filter(x=>x.module===n.id).length+' 个文件 / 契约':n.path||n.id,27);const title=svgEl('title');title.textContent=n.label+(n.path?'\n'+n.path:'');group.append(kind,label,sub,title);
    group.addEventListener('click',()=>{if(!moved)chooseNode(n.id);});group.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();chooseNode(n.id);}});svg.append(group);
  }
  fitted={x:0,y:0,w:width,h:height};if(resetView||!viewport)viewport={...fitted};applyView();
}
function applyView(){if(viewport)$('graph').setAttribute('viewBox',`${viewport.x} ${viewport.y} ${viewport.w} ${viewport.h}`);}
function zoom(factor){if(!viewport)return;const w=viewport.w*factor,h=viewport.h*factor;viewport={x:viewport.x+(viewport.w-w)/2,y:viewport.y+(viewport.h-h)/2,w,h};applyView();}
function render(resetView=true){
  projection=projected();if(selected&&!projection.nodes.some(n=>n.id===selected))selected=null;
  $('modules-mode').classList.toggle('active',mode==='modules');$('files-mode').classList.toggle('active',mode==='files');$('modules-mode').setAttribute('aria-pressed',mode==='modules');$('files-mode').setAttribute('aria-pressed',mode==='files');$('view-label').textContent=mode==='modules'?'模块概览':'文件与契约';$('list-title').textContent=mode==='modules'?'模块 / 边界':'文件 / 契约';$('focus').disabled=!selected;
  let edges=projection.edges.filter(statusAllowed),nodes=projection.nodes;
  const query=$('search').value.trim().toLowerCase();
  if(query){const matched=new Set(nodes.filter(n=>[n.label,n.path,n.summary,n.id,...(mode==='modules'?DATA.nodes.filter(x=>x.module===n.id).map(x=>x.path||x.label):[])].filter(Boolean).some(v=>v.toLowerCase().includes(query))).map(n=>n.id));const visible=new Set(matched);for(const e of edges)if(matched.has(e.source)||matched.has(e.target)){visible.add(e.source);visible.add(e.target);}nodes=nodes.filter(n=>visible.has(n.id));}
  if(($('relation-kind').value!=='all'||!$('confirmed').checked||!$('inferred').checked)&&!query){const connected=new Set(edges.flatMap(e=>[e.source,e.target]));nodes=nodes.filter(n=>connected.has(n.id));}
  if($('focus').checked&&selected){const visible=neighbors(selected,edges);nodes=nodes.filter(n=>visible.has(n.id));}
  const total=nodes.length;if(total>120)nodes=nodes.slice(0,120);const ids=new Set(nodes.map(n=>n.id));edges=edges.filter(e=>ids.has(e.source)&&ids.has(e.target));
  if(selectedEdge&&!edges.some(e=>e.id===selectedEdge))selectedEdge=null;
  $('graph-count').textContent=`${nodes.length} 节点 / ${edges.length} 关系`;$('graph-hint').textContent=total>120?`共 ${total} 个节点，展示前 120 个；请搜索缩小范围。`:'点击节点或连线查看证据 · 拖动画布移动';
  const list=$('node-list');list.replaceChildren();$('list-count').textContent=String(nodes.length);for(const n of nodes){const item=el('button','node-item '+n.kind+(selected===n.id?' active':''));item.setAttribute('aria-pressed',selected===n.id);const text=el('span');text.append(el('b',null,n.label),el('small',null,n.path||names[n.kind]));item.append(el('span','dot'),text);item.onclick=()=>chooseNode(n.id);list.append(item);}if(!nodes.length)list.append(el('p','notice','没有匹配的节点。请调整搜索或关系筛选。'));
  draw(nodes,edges,resetView);details();
}
$('project-name').textContent=DATA.project;document.title=DATA.project+' · 项目关系地图';$('module-count').textContent=DATA.nodes.filter(n=>n.kind==='module').length;$('edge-count').textContent=DATA.edges.filter(e=>e.status==='confirmed').length;$('pending-count').textContent=DATA.edges.filter(e=>e.status==='inferred').length;
$('snapshot-time').textContent=new Date(DATA.snapshot.created_at).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',hour12:false});$('snapshot-head').textContent=DATA.snapshot.head?'HEAD '+DATA.snapshot.head.slice(0,8):'非 Git 快照';$('coverage-caption').textContent=`已阅读 ${DATA.coverage.reviewed_files.length} / 清单 ${DATA.snapshot.file_count} 文件。待核实关系不作为已确认依赖。`;
for(const kind of [...new Set(DATA.edges.map(e=>e.kind))].sort()){const option=el('option',null,kinds[kind]);option.value=kind;$('relation-kind').append(option);}
$('modules-mode').onclick=()=>setMode('modules');$('files-mode').onclick=()=>setMode('files');for(const id of ['search','relation-kind','confirmed','inferred','focus'])$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='search'){selected=null;selectedEdge=null;$('focus').checked=false;}render();});
$('zoom-in').onclick=()=>zoom(.8);$('zoom-out').onclick=()=>zoom(1.25);$('fit').onclick=()=>{if(fitted){viewport={...fitted};applyView();}};
$('graph').addEventListener('wheel',event=>{event.preventDefault();zoom(event.deltaY>0?1.1:.9);},{passive:false});
$('graph').addEventListener('pointerdown',event=>{if(event.button!==0||!viewport)return;moved=false;const matrix=$('graph').getScreenCTM().inverse();drag={x:event.clientX,y:event.clientY,viewport:{...viewport},matrix};});
$('graph').addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){viewport={...drag.viewport,x:drag.viewport.x-dx*drag.matrix.a-dy*drag.matrix.c,y:drag.viewport.y-dx*drag.matrix.b-dy*drag.matrix.d};applyView();}});
window.addEventListener('pointerup',()=>{drag=null;});$('graph').addEventListener('pointerleave',()=>{drag=null;});
render();
</script>
</body>
</html>
